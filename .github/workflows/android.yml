name: Android alpha

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BabelEcho-Android-0.1.0-alpha.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BabelEcho-Android-0.1.0-alpha.1-debug
          path: BabelEcho-Android-0.1.0-alpha.1-debug.apk
          if-no-files-found: error
          retention-days: 30
